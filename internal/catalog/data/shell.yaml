- id: ssh
  group: shell
  detect: { paths: [~/.ssh/config, ~/.ssh/known_hosts] }
  files:
    linux: &sshfiles { base: ~/.ssh, include: [config, known_hosts] }
    macos: *sshfiles

- id: zsh
  group: shell
  install:
    debian: { apt: zsh }
    macos: { brew: zsh }
  detect: { packages: [zsh] }
  files:
    linux: &zshfiles { base: "~", include: [.zshrc, .zshenv, .zprofile, .p10k.zsh] }
    macos: *zshfiles
  post_install:
    - sudo chsh -s "$(command -v zsh)" "$USER"

- id: oh-my-zsh
  group: shell
  install:
    any:
      script: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
      bin: ~/.oh-my-zsh/oh-my-zsh.sh
  detect: { path: ~/.oh-my-zsh/oh-my-zsh.sh }
  requires: [zsh]
  files:
    linux: &omzfiles
      base: ~/.oh-my-zsh/custom
      include: ["*.zsh", "themes/*.zsh-theme"]
      exclude: [example.zsh, themes/example.zsh-theme]
    macos: *omzfiles

- id: fonts
  group: shell
  detect: { path: ~/.local/share/fonts/*, paths: [~/Library/Fonts/*] }
  files:
    linux: { base: ~/.local/share/fonts, include: ["**"], exclude: ["**/.uuid"], max_size_mb: 20 }
    macos: { base: ~/Library/Fonts, include: ["**"], exclude: ["**/.uuid"], max_size_mb: 20 }
  post_install:
    - command -v fc-cache >/dev/null && fc-cache -f || true

- id: tmux
  group: shell
  install:
    debian: { apt: tmux }
    macos: { brew: tmux }
  detect: { packages: [tmux] }
  files:
    linux: &tmuxfiles { base: "~", include: [.tmux.conf, .config/tmux/**] }
    macos: *tmuxfiles

- id: kitty
  group: terminals
  install:
    debian: { apt: kitty }
    macos: { cask: kitty }
  detect: { packages: [kitty] }
  files:
    linux: { base: ~/.config/kitty, include: ["**"] }

- id: terminator
  group: terminals
  skip: [macos]
  install:
    debian: { apt: terminator }
  detect: { packages: [terminator] }
  files:
    linux: { base: ~/.config/terminator, include: [config] }

- id: ghostty
  group: terminals
  install:
    debian: { snap: ghostty, classic: true }
    macos: { cask: ghostty }
  detect: { packages: [ghostty] }
  files:
    linux: { base: ~/.config/ghostty, include: ["**"] }
