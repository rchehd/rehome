- id: sublime-text
  group: editors
  install:
    debian: { snap: sublime-text, classic: true }
  detect: { packages: [sublime-text] }
  files:
    linux:
      base: ~/.config/sublime-text/Packages/User
      include: ["**"]
      exclude: &sublimeskip ["*.cache", "*.sublime_session", "Package Control.cache/**", "Package Control.*-ca-bundle", "oscrypto-ca-bundle.crt"]
    macos:
      base: ~/Library/Application Support/Sublime Text/Packages/User
      include: ["**"]
      exclude: *sublimeskip

- id: jetbrains-toolbox
  group: editors
  install:
    debian:
      script: >-
        tmp=$(mktemp -d) &&
        curl -fsSL "https://data.services.jetbrains.com/products/download?platform=linux&code=TBA" | tar -xz -C "$tmp" &&
        mkdir -p ~/.local/share/JetBrains/Toolbox/bin &&
        cp -r "$tmp"/jetbrains-toolbox-*/bin/* ~/.local/share/JetBrains/Toolbox/bin/ &&
        rm -rf "$tmp"
      bin: ~/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox
  # Toolbox may run from anywhere; its data dir proves it is in use.
  detect: { path: ~/.local/share/JetBrains/Toolbox/apps }
  files:
    linux:
      base: ~/.config/JetBrains
      include: ["*/codestyles/**", "*/keymaps/**", "*/templates/**", "*/colors/**", "*/fileTemplates/**", "*/inspection/**"]

- id: zed
  group: editors
  install:
    debian: { script: curl -fsSL https://zed.dev/install.sh | sh, bin: zed }
  detect: { path: ~/.local/zed.app/bin/zed, bins: [zed] }
  files:
    linux: { base: ~/.config/zed, include: [settings.json, keymap.json, themes/**] }

- id: cursor
  group: editors
  install:
    debian: { apt: cursor, repo: cursor }
  detect: { packages: [cursor], bins: [cursor] }
  files:
    linux: { base: ~/.config/Cursor/User, include: [settings.json, keybindings.json, snippets/**] }
