version: 2
apps:
  - id: google-chrome
    group: browsers
    install:
      debian: { apt: google-chrome-stable, repo: google-chrome }
      macos: { cask: google-chrome }
  - id: phpstorm
    group: editors
    install:
      debian: { snap: phpstorm, classic: true }
  - id: claude-code
    group: ai
    install:
      any: { script: "curl -fsSL https://claude.ai/install.sh | bash", bin: claude }
  - id: htop
    group: uncategorized
    install:
      debian: { apt: htop }
      macos: { brew: htop }
  - id: zsh
    group: shell
    install:
      debian: { apt: zsh }
    files: zsh

apt_repos:
  google-chrome:
    source: files/apt/sources/google-chrome.sources
    keyring: files/apt/keyrings/google-chrome.gpg

ignore:
  my-laptop: [phpstorm]
