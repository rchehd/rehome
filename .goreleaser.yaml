version: 2

builds:
  - main: ./cmd/rehome
    binary: rehome
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/rchehd/rehome/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "rehome_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
